name: .NET

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ApproovAzureValidation.sln

      - name: Build
        run: dotnet build ApproovAzureValidation.sln --configuration Release --no-restore

      - name: Test with coverage
        id: tests
        continue-on-error: true
        run: >
          dotnet test ApproovAzureValidation.sln
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --logger "trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Publish test and coverage summary
        id: summary
        if: always()
        run: |
          python3 .github/scripts/write-test-summary.py

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-coverage
          path: TestResults/**
          if-no-files-found: error

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
